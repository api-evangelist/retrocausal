aid: retrocausal
name: Retrocausal
description: >-
  Retrocausal builds AI-powered copilot software for manufacturing operations,
  applying patented computer vision and machine learning to manual assembly
  lines. Its products include Assembly Copilot (real-time AI-tracked work
  instructions, poka-yoke error prevention, and cycle-level video traceability),
  Kaizen Copilot (AI-powered time studies, standard work, automatic line
  balancing, and ergonomic analysis for industrial engineers), and Ergo Copilot
  (ergonomic risk assessment from smartphone video). The platform runs on AWS,
  is ISO 27001 certified, and integrates with MES systems, OPC UA for PLCs and
  smart tools, barcode scanners, torque wrenches, light towers, and projectors,
  with SSO via Azure Active Directory and Okta. Retrocausal is a Techstars
  portfolio company. It publishes no public developer API; integrations are
  delivered as custom MES/OPC UA and identity connections rather than a
  developer platform.
